<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        font-family: "myriad variable concept", sans-serif;
        background: #1d2b57;
        color: white;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 60px;
      }

      .logo {
        font-weight: 700;
        font-size: 24px;
        color: white;
      }

      nav ul {
        list-style: none;
        display: flex;
        gap: 30px;
      }

      nav ul li a {
        text-decoration: none;
        color: white;
        background: #3b73c5;
        padding: 10px 25px;
        border-radius: 20px;
        font-weight: 600;
      }

      .hero {
        padding: 40px 60px;
      }

      .hero-image {
        width: 4000%;
        max-width: 1500px;
        margin-left: 550px;
        display: block;
        border-radius: 50% 50% 50% 50% / 80% 0% 0% 80%;
        overflow: hidden;
      }

      .hero-text {
        margin-top: 30px;
        max-width: 500px;
      }

      .cta-btn {
        margin-top: 20px;
        background: #3b73c5;
        color: white;
        padding: 12px 28px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
      }

      .logo {
        font-weight: 200;
        font-size: 10px;
      }

      .hero-text h3 {
        color: #f15a29;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="/images/logo.png" width="130px" alt="logo" />
      </div>
      <nav>
       <ul>
          <li><a href="/index.html">Home</a></li>
          <li><a href="/About.html">About</a></li>
          <li><a href="/services.html">Services</a></li>
          <li><a href="/Contacts.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <img
        
        class="hero-image"
      />

      <div class="hero-text">
        <a href="contacts" class="cta-btn">Get In Touch</a>
      </div>
    </section>
  </body>
</html>
