<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        font-family: "myriad variable concept", sans-serif;
        background: #1d2b57;
        color: white;;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 60px;
      }

      .logo {
        font-weight: 700;
        font-size: 24px;
        color: white;
      }

      nav ul {
        list-style: none;
        display: flex;
        gap: 30px;
      }

      nav ul li a {
        text-decoration: none;
        color: white;
        background: #3b73c5;
        padding: 10px 25px;
        border-radius: 20px;
        font-weight: 600;
      }

      .hero {
        padding: 40px 60px;
      }

      .hero-image {
        width: 4000%;
        max-width: 1500px;
        margin-left: 550px;
        display: block;
        border-radius: 50% 50% 50% 50% / 80% 0% 0% 80%;
        overflow: hidden;
      }

      .hero-text {
        margin-top: 30px;
        max-width: 500px;
      }

      .cta-btn {
        margin-top: 20px;
        background: #3b73c5;
        color: white;
        padding: 12px 28px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
      }

      .logo {
        font-weight: 200;
        font-size: 10px;
      }

      .hero-text h3 {
        color: #f15a29;
        font-size: 20px;
      }

      .rectangle {
    width: 2750px;         /* Sets the width of the rectangle */
    height: 1100px;        /* Sets the height of the rectangle */
    background-color: #f15a29; 
    place-content: center;  /* Sets the background color of the rectangle */
    margin-left: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
}


    /* Sets the height of the square */
  .square {
  width: 1000px;
  height: 1030px;
  background-color: #142b64;
  border-radius: 50% 50% 50% 50% / 0% 80% 80% 0%;
  display:flex;
  margin-right: 200px;
}
.square2 {
  width: 1500px;
  height: 1030px;
  background: #142b64;
  position: relative;
  overflow: hidden;
  margin-right: 400px;
}

/* Outer curve */
.square2::before {
  content: "";
  position: absolute;
  left: -300px;
  top: 0;
  width: 600px;
  height: 100%;
  background: #142b64;
  border-radius: 50%;
}

/* Inner cut-out (creates inward curve) */
.square2::after {
  content: "";
  position: absolute;
  left: -200px;
  top: 0;
  width: 440px;
  height: 100%;
  background: #f15a29; /* must match page background */
  border-radius: 50%;
}


    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="index.html">
          <img src="/images/logo.png" alt="logo" width="200px">
        </a>
      </div>
     <nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="contacts.html">Contact</a></li>
  </ul>
</nav>
    </header>

   <div class="rectangle">
    <div class="square"></div>
    <div class="square2"></div>
   </div>

  </body>
</html>
